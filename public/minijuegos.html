<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minijuegos</title>
    <link rel="stylesheet" href="assets/styles/style-minijuegos.css">
</head>
<body>

    <div class="consola-body">
        
        <div class="top-bar">
            <div class="top-left">
                <div class="back-flecha"></div>
                <h1 class="logo-text">Minijuegos</h1>
            </div>
        </div>

        <div class="controles-area">
            
            <div class="left-controles">
                <div class="pill-button"></div> <div class="control-base">
                    <div class="control-cruz">
                        <div class="cruz-vertical"></div>
                        <div class="cruz-horizontal"></div>
                        <div class="cruz-center"></div> </div>
                </div>
            </div>

            <div class="screen-frame">
                <div class="juego-grid">
                    <div class="juego-item" style="background-image: url(assets/images/Rectangle\ 557.png);"></div>
                    <div class="juego-item" style="background-image: url(assets/images/Rectangle\ 560.png);"></div>
                    <div class="juego-item" style="background-image: url(assets/images/Rectangle\ 563.png);"></div>
                    <div class="juego-item" style="background-image: url(assets/images/Rectangle\ 558.png);"></div>
                    <div class="juego-item" style="background-image: url(assets/images/Rectangle\ 561.png);"></div>
                    <div class="juego-item" style="background-image: url(assets/images/Rectangle\ 564.png);"></div>
                    <div class="juego-item" style="background-image: url(assets/images/Rectangle\ 559.png);"></div>
                    <div class="juego-item" style="background-image: url(assets/images/Rectangle\ 562.png);"></div>
                    <div class="juego-item" style="background-image: url(assets/images/Rectangle\ 565.png);"></div>
                </div>
            </div>

            <div class="right-controles">
                <div class="pill-button"></div> <div class="action-buttons">
                    <div class="button circulo-button one"></div>
                    <div class="button circulo-button two"></div>
                    <div class="button circulo-button three"></div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
