<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/style-iniciar-sesion.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyonai</title>
</head>
    <body>
        <!--Encabezado de la pagina-->
        <nav class="Encabezado">
            <div class="LogoContainer">
                <a href="../index.html">
                    <span class="NombreLogo">Kyonai</span>
                </a>
            </div>
            <ul class="Menu-Horizontal">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="noticias.html">Noticias</a></li>
                <li><a href="mapas.html">Mapas</a></li>
                <li><a href="soporte.html">Soporte</a></li>
                <li><a href="inicio-sesion.html">Iniciar Sesión</a></li>
                <li><a href="">Simulación</a></li>
            </ul>
        </nav>
        
        <!--Seccion de Registro -->
        <!-- Encabezado de Registro -->
        <div class="TituloIniciarSesion">
            <h1>Bienvenido</h1>
        </div>
        <!--Seccion del formulario-->
        <section class="FormularioIniciarSesionGeneral">
            <div class="Formulario">
                <div class="FormularioTitulo"> 
                    <h2>Iniciar Sesión</h2>
                </div>
                <!--Formulario netamente-->
                <div class="FormularioRegistro">

                    <form onsubmit="return validarLogin(event);">
                        <div class="Campo">
                            <label for="Email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Ingrese su email" required>
                        </div>

                        <div class="Campo">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
                        </div>

                        <!--Iconos de otras apliaciones-->
                        <div class="MensajeOtrasFormas">
                            <h3>Más opciones</h3>
                        </div>

                        <div class="FormasRegistro">
                            <div class="IconoRedSocial">
                                <a href="https://accounts.google.com/ServiceLogin?hl=es&service=mail" target="_blank">
                                    <img src="assets/images/gmail-icono.png" alt="">
                                </a>
                            </div>
                            <div class="IconoRedSocial">
                                <a href="https://www.facebook.com/login/?locale=es_LA" target="_blank">
                                    <img src="assets/images/facebook-icono.jpg" alt="">
                                </a>
                            </div>
                            <div class="IconoRedSocial">
                                <a href="https://account.apple.com/sign-in" target="_blank">
                                    <img src="assets/images/apple-icono.png" alt="">
                                </a>
                            </div>
                        </div>
                        <!-- Boton de registro -->
                        <div class="BotonTipo1">
                            <button type="Submit" class="login-button">Iniciar Sesión</button>
                        </div>
                    </div>
                    <!-- Boton de registro -->
                     <div class="BotonTipo1">
                        <button type="Submit">Registrarme</button>
                    </div>
                    <!--Recuperar contraseña y Crear Cuenta (Registrarse)-->
                    <div class="Opciones-cuenta-general">
                        <div class="Opciones-cuenta-texto">
                            <p><a href="soporte.html">¿No puedes Iniciar sesión?</a></p>
                            <p><a href="registro.html">Crear cuenta</a></p>
                        <!--Recuperar contraseña y Crear Cuenta (Registrarse)-->
                        <div class="Opciones-cuenta-general">
                            <div class="Opciones-cuenta-texto">
                                <p><a href="soporte.html">¿No puedes Iniciar sesión?</a></p>
                                <p><a href="registro.html">Crear cuenta</a></p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
        <script src="scripts/login.js"></script>
    </body>
</html>
