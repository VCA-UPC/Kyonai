</header>

    <section class="content">
      <aside class="panel solicitudes">

            <div class="req-actions">

            </div>
          </div>

          <div class="req-row">
            <button class="avatar-circle"></button>
            <div class="req-text">
              <div class="req-name">Elvis Tek</div>
              <div class="req-code">RT5D3</div>
            </div>
            <div class="req-actions">
              <button class="btn-accept select-btn">✔</button>
              <button class="btn-reject select-btn">✖</button>
            </div>
          </div>

          <div class="req-row">
            <button class="avatar-circle"></button>
            <div class="req-text">
              <div class="req-name">Luz Clarito</div>
              <div class="req-code">E4RY2</div>
            </div>
            <div class="req-actions">

          </div>

          <div class="req-row">
            <button class="avatar-circle"></button>
            <div class="req-text">

              <div class="req-code">K4L7S</div>
            </div>
            <div class="req-actions">
              <button class="btn-accept select-btn">✔</button>
              <button class="btn-reject select-btn">✖</button>
            </div>
          </div>
        </div>
      </aside>

      <article class="panel recomendaciones">
        <h2>Recomendaciones en base a tus hobbies</h2>

        <div class="rec-grid">

          <div class="rec-card">
            <button class="avatar-circle rec-select"></button>
            <div class="rec-text">

          <div class="rec-card">

          <div class="rec-card">

        </div>
      </article>
    </section>
  </main>

  <script>
    function toggleSelect(button) {
      const parent = button.closest('.panel');
      parent.querySelectorAll('.selected').forEach(b => {
        if (b !== button) b.classList.remove('selected');
      });
      button.classList.toggle('selected');
    }

    document.addEventListener('click', function(e) {
      const t = e.target;

      if (t.classList.contains('avatar-circle') ||
          t.classList.contains('select-btn')) {
        toggleSelect(t);
      }

      if (t.classList.contains('btn-accept')) {
        t.closest('.req-row').style.opacity = '0.6';
      }

      if (t.classList.contains('btn-reject')) {
        t.closest('.req-row').remove();
      }
    });
  </script>

</body>
</html>
