<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles/style-chat.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyonai</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
</head>
<body>
    <section class="Titulo-horizontal">
        <div class="Regresar">
            <a href="Simulacion.html">
                <i class="fa-solid fa-play fa-flip-horizontal"></i>
            </a>
        </div>
        <div class="Chat-titulo">
            <h1>Chat</h1>
        </div>
    </section>
    <!--Seccion General del Chat -->
    <section class="Chat-general">
        <!-- Menu vertical Lista de Opciones -->
        
        <!-- BOTÓN HAMBURGUESA -->
        <button class="menu-toggle" aria-label="Abrir menú">
          &#9776;
        <!-- Ícono de hamburguesa -->
        </button>
        
        <div class="Menu-vertical-videojuego-tipo1">
            <ul>
                <li><a href="chat-principal.html">Amigos</a></li>
                <li><a href="chat-grupo.html">Grupos</a></li>
                <li><a href="chat-crear-grupo.html">Crear Grupo</a></li>
            </ul>
        </div>
        <!--Menu vertical Lista de Amigos-->
        <div class="Menu-vertical-videojuego-tipo2">
            <div class="Subtitulo">
                <i class="fa-solid fa-users" id="icono-users"></i>
                <h2>Lista de Grupos</h2>
            </div>
            <div class="Lista-Amigos">
                <div class="Amigo">
                    <i class="fa-solid fa-circle" style="color: #FFD43B;"></i>
                    <h4>Los inmortales</h4>
                </div>
                <div class="Amigo">
                    <i class="fa-solid fa-circle" style="color: #ee177e;"></i>
                    <h4>Kpopers</h4>
                </div>
                <div class="Amigo">
                    <i class="fa-solid fa-circle" style="color: #05e108;"></i>
                    <h4>Otakus</h4>
                </div>
                <div class="Amigo">
                    <i class="fa-solid fa-circle" style="color: #63E6BE;"></i>
                    <h4>Gamers</h4>
                </div>
            </div>
        </div>
        <!-- Chat cuadro especificamente -->
         <div class="Chat-cuadro-general">
            <div class="Chat-medidas">
                <div class="Chat-usuario">
                    <i class="fa-solid fa-circle" style="color: #ee177e;"></i>
                    <h2>Kpopers</h2>
                </div>
                <div class="Mensajes" id="mensajes-container">
                </div>
                <div class="Cuadro-texto">
                    <i class="fa-regular fa-note-sticky" id="icono-stickers"></i>
                    <input type="text" id="input-mensaje" placeholder="Escriba aqui su mensaje">
                    <i class="fa-regular fa-paper-plane" id="btn-enviar"></i>
                </div>
            </div>
         </div>

    </section>
    <script src="scripts/Chat-menu-hamburgesa.js"></script>
</body>
